<style>

<div id="static"><div class="empty"><h1>That's all for today</h1><p>New articles arrive tomorrow morning.</p></div></div>
<div class="foot"><span>Sat Nov 14</span><span>32/36</span></div>
<script>
(function () {
  try {
    var D = {"articles": [{"topic": "Politics", "title": "National ground stop response highlights critical errors in public reassurance – saying ‘nothing nefarious’ did the opposite of quelling public concern", "byline": "Shannon A. Bowen, Professor of Journalism and Mass Communications, University of South Carolina · The Conversation · Nov 14", "paras": [[0, "Thousands of travelers were stranded on Nov. 13, 2026, when the Federal Aviation Administration grounded all domestic flights in the U.S."], [0, "because of what they said were failures in decades-old air traffic communications systems. Crisis communications expert Shannon A. Bowen, a scholar at the University of South Carolina’s College of Information and Communications, spoke with The Conversation’s Politics and Legal Affairs Editor, Naomi Schalit, about how the Trump administration handled the first day of the crisis."], [0, "Is there a first principle in crisis communications?"], [0, "The first principle would be to react quickly and react with accuracy, react with everything you know at the moment, truthfully, but always react"], [0, "quickly. Because if you delay until you gather information, a vacuum will ensue. Information fills that vacuum that may not be accurate. And so that’s the enemy of accurate crisis communication, but you want to always speak quickly and be the most authoritative and definitive source, even if very little information is known."], [0, "What did we see on the day of the ground stop?"], [0, "A crisis unfolded and to the administration’s credit, they did react very quickly, in a way that offered the information that was known at the time, even though not a"], [0, "lot was known about why the ground stop was issued until later."], [0, "You’re speaking about the short press conference that afternoon with Department of Homeland Security Secretary Markwayne Mullin?"], [0, "He did keep saying that nothing nefarious was at hand. And for a crisis communication scholar, you would not want to introduce the idea that something nefarious was at hand, unless, indeed, something nefarious was at hand. So by the very act of introducing this concept and this idea, I think the talking point, “Nothing nefarious,”"], [0, "then went across multiple networks, and it became the center of a controversy rather than quelling a controversy."], [0, "By saying nothing nefarious is at hand, that indeed confirmed something nefarious was at hand, even if the nefariousness was only the mismanagement of the air traffic control systems routers that they claimed caused the problem. By introducing this idea, I believe it did bring to mind that there may be other state actors behind whatever happened, that it could be a cyber attack."], [0, "It would have been better to say, “We have evidence that this was not a cyber attack but a hardware failure.”"], [0, "How did the later press conference with Mullin and Transportation Secretary Sean Duffy go from your perspective as an expert on crisis communications?"], [0, "They handled the questions that they received correctly. They told us as much information as they knew."], [0, "However, they did seem to downplay the extent of this crisis, because we have to remember the traveling public is not just people trying to get to business meetings."], [0, "We had football teams stranded. Now football Saturday, all over the SEC, has been disrupted. And there’s probably disruption in other areas of the country, but to us in the South, SEC football is almost a religious experience on Saturday. Luckily, the University of South Carolina football team had already flown out. But our marching band was stuck in this crisis, and so we have a lot of ripple effects from something like this happening, and it definitely says to me that this was an emergency situation. It wasn’t simply a crisis, it was an actual emergency of impending disaster-level scale."], [0, "If it were simply routers being overloaded, as we’ve been told, why wouldn’t they already know this situation and restart those routers the night before or over Friday night after most of the traveling public is out of the air?"], [0, "What was Mullin’s and Duffy’s job when they got out there? What did they need to do?"], [0, "To inform the public about the danger, why this happened, the extent of the problem, and what they’re doing to remediate the problem."], [0, "We keep hearing that they’re asking for US$30 billion and more to repair the whole infrastructure for the air traffic control system, which is great, but what are they doing right now?"], [0, "How do we know that flights in the air, right this minute, are any safer than the ones yesterday, a minute before the ground stop? Do we have that information? I don’t feel confident that they addressed that question appropriately. I don’t think that the traveling public entirely feels safe at this point or adequately informed that they will arrive at their destination."], [0, "They introduced politics into the press conference as well, didn’t they?"], [0, "It’s something that they have the prerogative to do. They are both political appointees and members of the cabinet. So I understand that aspect, but I really wish they had addressed the traveling public’s concerns more overtly before making it political, that they need more money to fix this. We know they need more money to fix it, and I’m sure the American taxpayers are aware of the problem and willing to fund those corrections."], [0, "But the more expedient issues would be, what about all these people who were stuck in airports?"], [0, "Were there warning signs for this crisis?"], [0, "I believe there were. We had another ground stop about three years ago, due to air traffic control problems, and that is what we call in crisis communications a “prodrome,” a warning sign of larger impending problems. When you see these types of warning signs, it really gives us a reason to think it’s going to get worse."], [0, "Duffy did say on Nov. 13 that, because of the condition of the air traffic infrastructure, “you will have more” ground stoppages. If you had a piece of advice for the administration regarding their future communications, what would you tell them?"], [0, "I would say to communicate in advance as much as possible, so if you’re even considering a ground stop, it may be a good idea to put out a public notice so that people don’t go to the airport on a vacation flight, maybe they delay that for a week or two."], [0, "It might also be a good idea to speak with the airline industry representatives and say, “Here’s what we’re thinking. Can you work with us? How can we make this better for the traveling public?” Also, if 17 of 22 routers were malfunctioning, could we have had a partial ground stop at only the affected airports, rather than a nationwide stop?"], [0, "My silly last question: Do crisis communications experts have any theories about Friday the 13th?"], [0, "We consider it more of a superstition, but I have noticed that there does tend to be a lot of activity on Friday the 13th."], [0, "It might be placebo effect, it might be because we expect something bad to happen and we’re looking for it. But that day does seem to always have some type of activity. This is also when organizations release bad news, oftentimes, they say, “Let’s hold it until Friday the 13th, because bad news is expected.” People will assume, on Friday the 13th, that negative things are going to come out, so the shock value won’t be as much."], [0, "Shannon A. Bowen received funding in 2022-2023 from The National Science Foundation as PI on a grant studying disaster management."]], "end": "End of article · republished from The Conversation (CC BY-ND) · ref 296663"}, {"topic": "Nature & Environment", "title": "Oceans and forests have absorbed roughly half our carbon emissions for decades, slowing climate change – but can they keep it up?", "byline": "Eric J. Morgan, Project Scientist in Geosciences, University of California, San Diego · The Conversation · Nov 13", "paras": [[0, "Over the past two centuries, humans have pumped billions of tons of carbon dioxide into the atmosphere by burning fossil fuels, raising global temperatures in the process."], [0, "Luckily for humanity, Earth has done what it could to soften the impact."], [0, "The world’s oceans have absorbed 35% of carbon dioxide emissions from fossil fuels since 1990, our new research shows, and the forests and other plants of the world have absorbed another 13%."], [0, "The importance of these two enormous natural carbon sinks cannot be overstated as global temperatures rise, fueling heat waves, fires, storms, floods and droughts around the world."], [0, "Yet there is much that scientists do not understand about these carbon sinks – most importantly, how exactly they’ll behave in the future."], [0, "If the oceans and forests keep absorbing the same amount of carbon dioxide, scientists will have a sense of what to expect in the future and what can be done to slow climate change. And governments will know their remaining carbon budgets – that is, how much carbon dioxide can still be emitted into the atmosphere while keeping global temperatures below agreed-to levels."], [0, "But what if those carbon sinks change?"], [0, "We have been working on greenhouse gas measurements for decades. In a new study, published Nov. 12, 2026, in the journal Science, we describe an alternative method for measuring these crucial carbon sinks, and what it shows."], [0, "We found that while the ocean sink has been expanding, meaning the oceans are taking in more carbon dioxide, that expansion might begin to slow down, leaving the oceans less effective at absorbing carbon in the coming decades. We found that the land sink has not been expanding, which was something of a surprise."], [1, "The fiendishly difficult task of measuring carbon sinks"], [0, "Measuring how much carbon is being taken up by the world’s oceans and forests is devilishly difficult and prohibitively expensive."], [0, "This is because many parts of the land and ocean don’t behave in the same ways. What occurs in one ocean region or forest can be very different from another; and the behavior in one year can be very different in the next, often for reasons scientists do not fully understand."], [0, "Computer models can help overcome some of these complexities, but they too have limitations. Satellites can also help, but they cannot see through clouds, nor can they see what is happening in the soil or mid-to-deep ocean."], [0, "As carbon cycle scientists, we set out to find a different way to measure these carbon sinks."], [0, "Our new study approaches the problem from another angle."], [0, "We used high-precision measurements of atmospheric oxygen (O₂), combined with atmospheric carbon dioxide (CO₂) measurements, to quantify how the ocean and land carbon sinks takeing up carbon dioxide."], [0, "This works because land, oceans and burning fossil fuels have different effects on oxygen: When fossil fuels are burned, they not only produce CO₂, they consume O₂. On land, when plants take up CO₂ to grow, they simultaneously release O₂. When the oceans take up atmospheric CO₂, there is no corresponding release of O₂."], [0, "This means that if we measure both CO₂ and O₂ in the atmosphere, then we"], [0, "can quantify the ocean and land carbon sinks. It is a straightforward mathematical approach of solving two equations with two unknowns, combined with our knowledge and measurements of the global budgets of CO₂ and O₂."], [1, "What we found"], [0, "When we looked at the ocean and land carbon sinks over the past three decades, the results were surprising and sobering."], [0, "In contrast to most computer model simulations, we did not find the land carbon sink increasing over time to keep pace with increasing fossil fuel emissions."], [0, "We did, however, find a larger ocean carbon sink than predicted by most models, and we found that it has been increasing as emissions grow."], [0, "Where is the climate headed?"], [0, "If these trends in carbon sinks continue, then in the coming decades, humans will be relying more heavily on the oceans to slow down climate change. But in the next few decades, there are reasons to believe the oceans could become less effective at absorbing carbon."], [0, "For example, warmer waters are not able to hold as much gas, such as carbon dioxide."], [0, "Warmer surface waters are also less efficient at mixing into the deep ocean, which has the beneficial effect of locking carbon dioxide away from the atmosphere for many hundreds of years."], [0, "The data for the past decade hints at the possibility that while the ocean carbon sink is increasing now, its rate of increase may be slowing down."], [1, "Carbon cycle models need to improve"], [0, "For the oceans, most computer models agree with each other, but, for the historical period, they do not match our oxygen-based results."], [0, "For the land, models vary widely from each other, and most do not match our oxygen-based results."], [0, "Computer models are essential to provide governments with feasible scenarios to avoid dangerous climate change, but to be effective they need to be better grounded in what real-world observations are showing. Nature is difficult to represent with a series of equations, and observations are few considering the size of the planet."], [1, "Looking ahead"], [1, "We believe our study improves understanding of global carbon sinks"], [0, "and can help lead to more reliable projections of what might happen with climate change in the coming decades. But like any scientific approach, our oxygen method also has drawbacks."], [0, "The measurements themselves are challenging, such that only about 10 research laboratories in the world are routinely doing them. Calibrating the measurements is an ongoing challenge. Earth is not helping: Warmer waters hold less gas, meaning that as oceans warm in response to climate change, they expel some oxygen into the atmosphere. We must account for this in our carbon sink calculations."], [0, "And to take into account variability in ocean circulation and other ocean processes, we have to average our results over 10-year time frames."], [0, "Policymakers and the public need answers faster. We believe the solution involves both improving the atmospheric oxygen approach and using other independent approaches: measurements of carbon and oxygen in the oceans, computer models and satellites are all essential."], [0, "Combining these approaches will lead to more robust understanding of the carbon cycle and climate change, and better knowledge of where these valuable carbon sinks and the global climate are headed."], [0, "Andrew Manning has previously received funding from the United Kingdom's Natural Environment Research Council (NERC), and from the European Union's Horizon Europe and European Research Council's research science funding streams."], [0, "Eric J."], [0, "Morgan received funding for this project from the National Science Foundation, the National Oceanic and Atmospheric Administration, and Schmidt Sciences LLC."]], "end": "End of article · republished from The Conversation (CC BY-ND) · ref 296498"}]}, N = 32, W = 440, GAP = 40;
    var top = document.querySelector('.top'), foot = document.querySelector('.foot');
    var y0 = top.offsetTop + top.offsetHeight + 12;
    var H = Math.floor(foot.offsetTop - 6 - y0);
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function make(a) {
      var vp = document.createElement('div');
      vp.style.cssText = 'position:absolute;left:20px;top:' + y0 + 'px;width:' + W + 'px;height:' + H + 'px;overflow:hidden;visibility:hidden';
      var f = document.createElement('div');
      f.style.cssText = 'position:relative;left:0;width:' + W + 'px;height:' + H + 'px;column-width:' + W + 'px;column-gap:' + GAP + 'px;column-fill:auto';
      var h = '<h1>' + esc(a.title) + '</h1><div class="by">' + esc(a.byline) + '</div>';
      for (var i = 0; i < a.paras.length; i++) {
        h += a.paras[i][0] ? '<h2>' + esc(a.paras[i][1]) + '</h2>' : '<p>' + esc(a.paras[i][1]) + '</p>';
      }
      h += '<div class="end">' + esc(a.end) + '</div>';
      f.innerHTML = h; vp.appendChild(f); document.body.appendChild(vp);
      return { vp: vp, f: f, n: Math.max(1, Math.round((f.scrollWidth + GAP) / (W + GAP))) };
    }
    var laid = [], k = N - 1, hit = null;
    for (var i = 0; i < D.articles.length; i++) {
      var L = make(D.articles[i]); laid.push(L);
      if (!hit && k < L.n) { hit = { L: L, a: D.articles[i], p: k }; }
      else if (!hit) { k -= L.n; }
    }
    for (var j = 0; j < laid.length; j++) { if (!hit || laid[j] !== hit.L) laid[j].vp.parentNode.removeChild(laid[j].vp); }
    var st = document.getElementById('static');
    if (hit) {
      hit.L.f.style.left = (-hit.p * (W + GAP)) + 'px';
      hit.L.vp.style.visibility = 'visible';
      document.getElementById('tl').textContent = hit.a.topic;
      document.getElementById('tr').textContent = (hit.p + 1) + '/' + hit.L.n;
      st.style.display = 'none';
    } else {
      document.getElementById('tl').textContent = 'Sticky Reader';
      document.getElementById('tr').textContent = '';
      st.innerHTML = '<div class="empty"><h1>' + (D.articles.length ? "That's all for today" : 'No new articles today') +
        '</h1><p>New articles arrive tomorrow morning.</p></div>';
    }
  } catch (e) { /* keep the server-side layout */ }
})();
</script>
