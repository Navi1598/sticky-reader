name: Build daily Sticky pages

on:
  schedule:
    # 10:45 UTC = 5:45 AM Eastern (winter) / 6:45 AM (summer)
    - cron: "41 10 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: sticky-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build pages
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "sticky-reader-bot"
          git config user.email "sticky-reader-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily pages $(date -u +%Y-%m-%d)"
            git push
          fi
