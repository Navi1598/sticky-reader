# Sticky Reader configuration
# ---------------------------------------------------------------
# Each topic gets ONE article per day, split into up to
# `pages_per_topic` pages. Pages are published as p01.html, p02.html, ...
# in topic order, so the total number of SenseCraft designs you need is:
#     number_of_topics x pages_per_topic   (default: 4 x 4 = 16)

pages_per_topic: 4

# Page fit. Lower lines_per_page if text gets cut off at the bottom of a page;
# raise it if pages have empty space at the bottom.
lines_per_page: 23
chars_per_line: 47

# Only consider articles published within this many days.
max_age_days: 4

# Order matters: this is the order you'll read in on the Sticky.
topics:
  - name: Technology
    feeds:
      - https://theconversation.com/us/technology/articles.atom

  - name: Politics
    feeds:
      - https://theconversation.com/us/politics/articles.atom

  - name: Nature & Environment
    feeds:
      - https://theconversation.com/us/environment/articles.atom

  # Pages are hosted publicly on GitHub Pages, so stick to sources whose
  # license allows republishing (The Conversation: CC BY-ND, credit given on
  # each article). Battery stories are pulled from several sections by keyword.
  - name: Batteries (EV & Drones)
    feeds:
      - https://theconversation.com/us/technology/articles.atom
      - https://theconversation.com/us/environment/articles.atom
      - https://theconversation.com/us/business/articles.atom
      - https://theconversation.com/global/articles.atom
    # Only articles whose title or summary contains one of these words
    keywords:
      - battery
      - batteries
      - lithium
      - sodium-ion
      - solid-state
      - cathode
      - anode
      - cell chemistry
      - charging
      - electric vehicle
      - drone
