# Sticky Reader configuration
# ---------------------------------------------------------------
# Each topic gets ONE article per day. All articles share one pool of pages,
# published as p01.html ... pNN.html, one after another with no blank gaps.
# total_pages = how many SenseCraft designs you've set up (one per page URL).
# Short articles leave room for longer ones; only if the day's articles
# don't fit at all is the last one cut short. Unused pages say "That's all for today".

total_pages: 28

# Text size on the Sticky, in pixels (19 = smaller, 21 = default, 23 = large).
# Bigger text means more pages per article, so raise total_pages to match.
font_size: 21

# Page fit is worked out from font_size automatically. Only if text gets cut off
# at the bottom of pages (or leaves big gaps), uncomment and adjust:
# lines_per_page: 23
# chars_per_line: 48

# Only consider articles published within this many days.
max_age_days: 4

# Order matters: this is the order you'll read in on the Sticky.
topics:
  - name: Technology
    feeds:
      - https://theconversation.com/us/technology/articles.atom

  - name: Politics
    feeds:
      - https://theconversation.com/us/politics/articles.atom

  - name: Nature & Environment
    feeds:
      - https://theconversation.com/us/environment/articles.atom

  # Pages are hosted publicly on GitHub Pages, so stick to sources whose
  # license allows republishing (The Conversation: CC BY-ND, credit given on
  # each article). Battery stories are pulled from several sections by keyword.
  - name: Batteries (EV & Drones)
    feeds:
      - https://theconversation.com/us/technology/articles.atom
      - https://theconversation.com/us/environment/articles.atom
      - https://theconversation.com/us/business/articles.atom
      - https://theconversation.com/global/articles.atom
    # Only articles whose title or summary contains one of these words
    keywords:
      - battery
      - batteries
      - lithium
      - sodium-ion
      - solid-state
      - cathode
      - anode
      - cell chemistry
      - charging
      - electric vehicle
      - drone
